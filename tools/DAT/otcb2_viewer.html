<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTCB2 DAT Viewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0a0c0f;
    --bg2: #111418;
    --bg3: #1a1e24;
    --border: #2a2f38;
    --accent: #00e5ff;
    --accent2: #ff6b00;
    --text: #e0e8f0;
    --text2: #7a8a9a;
    --green: #00ff88;
    --red: #ff3355;
    --yellow: #ffd700;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 48px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .logo span { color: var(--accent2); }

  .header-sep { width: 1px; height: 20px; background: var(--border); }

  .file-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    letter-spacing: .5px;
  }
  .file-btn:hover { border-color: var(--accent); color: var(--accent); }
  .file-btn .icon { font-size: 12px; opacity: .6; }
  #fileInput { display: none; }

  .file-info {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text2);
  }
  .file-info.loaded { color: var(--green); }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  .stat-pill {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    color: var(--text2);
  }
  .stat-pill b { color: var(--accent); font-weight: normal; }

  /* ── MAIN LAYOUT ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .stab {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--text2);
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .stab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .sidebar-panel { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
  .sidebar-panel.active { display: flex; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── HEADER LIST ── */
  .hdr-table { width: 100%; }
  .hdr-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .hdr-row:last-child { border-bottom: none; }
  .hdr-key { color: var(--text2); font-size: 11px; letter-spacing: .5px; }
  .hdr-val { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--accent); }

  /* ── COLOUR PALETTE ── */
  .palette-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px;
  }
  .pal-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    transition: transform .1s;
  }
  .pal-item:hover { transform: scale(1.1); }
  .pal-swatch {
    width: 30px; height: 20px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,.1);
  }
  .pal-swatch.selected { border: 2px solid var(--accent); }
  .pal-count {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--text2);
  }

  /* ── PRIM LIST ── */
  .prim-search {
    margin: 8px;
    padding: 6px 10px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    width: calc(100% - 16px);
    outline: none;
    flex-shrink: 0;
  }
  .prim-search:focus { border-color: var(--accent); }

  .prim-list { flex: 1; overflow-y: auto; }
  .prim-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    border-bottom: 1px solid rgba(42,47,56,.5);
    cursor: pointer;
    transition: background .1s;
    font-size: 11px;
    font-family: 'Share Tech Mono', monospace;
  }
  .prim-row:hover { background: var(--bg3); }
  .prim-row.selected { background: rgba(0,229,255,.08); border-left: 2px solid var(--accent); }
  .prim-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .prim-idx { color: var(--text2); min-width: 32px; }
  .prim-verts { color: var(--text); flex: 1; }
  .prim-type { color: var(--accent2); font-size: 9px; }

  /* ── CENTRE: CANVAS AREA ── */
  .canvas-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .canvas-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .tb-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .5px;
    padding: 4px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: all .15s;
  }
  .tb-btn:hover, .tb-btn.active { border-color: var(--accent); color: var(--accent); }
  .tb-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }

  .tb-label { font-size: 11px; color: var(--text2); letter-spacing: .5px; }

  .tb-slider {
    -webkit-appearance: none;
    width: 80px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .tb-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  canvas#viewport {
    flex: 1;
    display: block;
    cursor: grab;
  }
  canvas#viewport:active { cursor: grabbing; }

  /* ── DROP ZONE overlay ── */
  .drop-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--bg);
    z-index: 5;
    transition: opacity .3s;
  }
  .drop-overlay.hidden { opacity: 0; pointer-events: none; }

  .drop-box {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 48px 64px;
    text-align: center;
    transition: border-color .2s, background .2s;
    cursor: pointer;
  }
  .drop-box:hover, .drop-box.drag-over {
    border-color: var(--accent);
    background: rgba(0,229,255,.04);
  }
  .drop-icon {
    font-size: 48px;
    margin-bottom: 12px;
    filter: grayscale(.5);
  }
  .drop-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .drop-sub { font-size: 13px; color: var(--text2); }
  .drop-hint {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 1px;
  }

  /* ── INFO PANEL (right) ── */
  .info-panel {
    width: 220px;
    flex-shrink: 0;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .info-section {
    border-bottom: 1px solid var(--border);
    padding: 12px 14px;
  }
  .info-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 3px 0;
  }
  .info-key { color: var(--text2); }
  .info-val { font-family: 'Share Tech Mono', monospace; color: var(--text); font-size: 11px; }
  .info-val.accent { color: var(--accent); }
  .info-val.warn { color: var(--accent2); }

  .colour-preview {
    width: 100%;
    height: 40px;
    border-radius: 4px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
  }

  /* ── STATUS BAR ── */
  .statusbar {
    height: 24px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 14px;
    flex-shrink: 0;
  }
  .status-item {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text2);
    letter-spacing: .5px;
  }
  .status-item b { color: var(--accent); font-weight: normal; }
  .status-item.err b { color: var(--red); }
  .status-item.ok b { color: var(--green); }

  /* ── AXES indicator ── */
  #axesCanvas {
    position: absolute;
    bottom: 36px;
    right: 230px;
    width: 70px;
    height: 70px;
    pointer-events: none;
  }

  /* loading spinner */
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">OTCB<span>2</span> · DAT VIEWER</div>
  <div class="header-sep"></div>
  <button class="file-btn" onclick="document.getElementById('fileInput').click()">
    <span class="icon">📂</span> OPEN FILE
  </button>
  <input type="file" id="fileInput" accept=".dat,.DAT,*">
  <div class="file-info" id="fileLabel">NO FILE LOADED</div>
  <div class="header-right">
    <div class="stat-pill">PRIMS <b id="hPrims">—</b></div>
    <div class="stat-pill">VERTS <b id="hVerts">—</b></div>
    <div class="stat-pill">COLOURS <b id="hCols">—</b></div>
    <div class="spinner" id="spinner"></div>
  </div>
</header>

<!-- MAIN -->
<div class="main">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-tabs">
      <div class="stab active" onclick="switchSTab(0,this)">PRIMS</div>
      <div class="stab" onclick="switchSTab(1,this)">PALETTE</div>
      <div class="stab" onclick="switchSTab(2,this)">HEADER</div>
    </div>

    <!-- Primitives panel -->
    <div class="sidebar-panel active" id="spanel-0">
      <input class="prim-search" id="primSearch" placeholder="SEARCH..." oninput="filterPrims(this.value)">
      <div class="prim-list" id="primList"></div>
    </div>

    <!-- Palette panel -->
    <div class="sidebar-panel" id="spanel-1">
      <div class="palette-grid" id="paletteGrid"></div>
    </div>

    <!-- Header panel -->
    <div class="sidebar-panel" id="spanel-2">
      <div class="hdr-table" id="hdrTable"></div>
    </div>
  </div>

  <!-- CANVAS AREA -->
  <div class="canvas-area">

    <!-- Drop overlay -->
    <div class="drop-overlay" id="dropOverlay">
      <div class="drop-box" id="dropBox" onclick="document.getElementById('fileInput').click()">
        <div class="drop-icon">🗂️</div>
        <div class="drop-title">LOAD DAT FILE</div>
        <div class="drop-sub">Click to browse or drag & drop</div>
      </div>
      <div class="drop-hint">Option Tuning Car Battle 2 · PS1 mesh format</div>
    </div>

    <!-- Toolbar -->
    <div class="canvas-toolbar">
      <span class="tb-label">VIEW</span>
      <button class="tb-btn active" id="btnWire" onclick="toggleMode('wire',this)">WIRE</button>
      <button class="tb-btn" id="btnFlat" onclick="toggleMode('flat',this)">FLAT</button>
      <button class="tb-btn" id="btnBoth" onclick="toggleMode('both',this)">BOTH</button>
      <div class="tb-sep"></div>
      <span class="tb-label">ZOOM</span>
      <input class="tb-slider" type="range" id="zoomSlider" min="0.1" max="5" step="0.05" value="1" oninput="setZoomSlider(this.value)">
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="resetCamera()">RESET</button>
      <button class="tb-btn" onclick="frameAll()">FIT</button>
      <div class="tb-sep"></div>
      <span class="tb-label">FILTER</span>
      <button class="tb-btn" id="btnAll" onclick="setFilter('all',this)">ALL</button>
      <button class="tb-btn" id="btnSel" onclick="setFilter('selected',this)">SELECTED</button>
    </div>

    <canvas id="viewport"></canvas>
    <canvas id="axesCanvas"></canvas>
  </div>

  <!-- INFO PANEL -->
  <div class="info-panel" id="infoPanel">
    <div class="info-section">
      <div class="info-title">Selection</div>
      <div id="selInfo">
        <div class="info-row"><span class="info-key">Primitive</span><span class="info-val">—</span></div>
        <div class="info-row"><span class="info-key">Type</span><span class="info-val">—</span></div>
      </div>
    </div>
    <div class="info-section">
      <div class="info-title">Colour</div>
      <canvas class="colour-preview" id="colPreview" width="180" height="40"></canvas>
      <div id="colInfo"></div>
    </div>
    <div class="info-section">
      <div class="info-title">Vertices</div>
      <div id="vertInfo"></div>
    </div>
    <div class="info-section">
      <div class="info-title">Camera</div>
      <div id="camInfo"></div>
    </div>
  </div>
</div>

<!-- STATUS BAR -->
<div class="statusbar">
  <div class="status-item" id="stStatus">STATUS <b>IDLE</b></div>
  <div class="status-item" id="stMouse">MOUSE <b>—</b></div>
  <div class="status-item" id="stCam">CAM <b>—</b></div>
  <div class="status-item" id="stSel">SEL <b>NONE</b></div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  PARSER
// ═══════════════════════════════════════════════════
const HDR_SIZE = 40;
const REC_SIZE = 20;

function r16le(buf, o) { return buf[o] | (buf[o+1] << 8); }
function r32le(buf, o) { return (buf[o]|(buf[o+1]<<8)|(buf[o+2]<<16)|(buf[o+3]<<24)) >>> 0; }
function h2(n) { return (n & 0xFF).toString(16).toUpperCase().padStart(2,'0'); }

function parseDAT(buffer) {
  const bytes = new Uint8Array(buffer);
  const len = bytes.length;

  const header = {
    id:        r32le(bytes, 0),
    unk1:      r32le(bytes, 4),
    unk2:      r32le(bytes, 8),
    dataOff:   r32le(bytes, 12),
    recCount:  r32le(bytes, 16),
    totalVerts:r32le(bytes, 20),
    faceCount: r32le(bytes, 24),
    unk3:      r32le(bytes, 28),
    faceCount2:r32le(bytes, 32),
    unk4:      r32le(bytes, 36),
  };

  const prims = [];
  const totalRecs = Math.floor((len - HDR_SIZE) / REC_SIZE);

  for (let i = 0; i < totalRecs; i++) {
    const o = HDR_SIZE + i * REC_SIZE;
    if (o + REC_SIZE > len) break;
    const r = bytes[o], g = bytes[o+1], b = bytes[o+2], a = bytes[o+3];
    const flag = bytes[o+6];
    const idx  = r16le(bytes, o+8);
    const v0   = r16le(bytes, o+10);
    const v1   = r16le(bytes, o+12);
    const v2   = r16le(bytes, o+14);
    const v3   = r16le(bytes, o+16);
    // skip clearly-invalid records (no colour, huge indices likely noise)
    if (r===0 && g===0 && b===0 && a===0 && v0===0 && v1===0) continue;
    prims.push({ i, r, g, b, a, flag, idx, v0, v1, v2, v3,
      hex: `#${h2(r)}${h2(g)}${h2(b)}` });
  }

  // colour map
  const colorMap = {};
  prims.forEach(p => {
    const k = p.hex;
    if (!colorMap[k]) colorMap[k] = { r:p.r, g:p.g, b:p.b, count:0, hex:k };
    colorMap[k].count++;
  });

  // unique vertices
  const uVerts = new Set();
  prims.forEach(p => {
    uVerts.add(p.v0); uVerts.add(p.v1); uVerts.add(p.v2);
    if (p.v3) uVerts.add(p.v3);
  });

  return { header, prims, colorMap, uVerts, bytes, fileSize: len };
}

// ═══════════════════════════════════════════════════
//  SURFACE GUESSER
// ═══════════════════════════════════════════════════
function guessSurface(r, g, b) {
  const rr=r,gg=g,bb=b;
  if (rr===0xAD&&gg===0xAD&&bb===0xAD) return 'Asphalt road';
  if (rr===0xFF&&gg===0xFF&&bb===0xFF) return 'White line marking';
  if (rr===0xBB&&gg===0&&bb===0) return 'Red kerb/barrier';
  if (rr===0x57&&gg===0x57&&bb===0x57) return 'Concrete barrier';
  if (rr===0xC8&&gg===0xC8&&bb===0xC8) return 'Light concrete';
  if (rr===0x80&&gg===0x80&&bb===0x80) return 'Grey neutral';
  if (rr===0&&gg===0&&bb===0x46) return 'Dark road/night';
  if (rr===0x37&&gg===0x37&&bb===0) return 'Dry/olive grass';
  if (rr===0xB9&&gg===0xB1&&bb===0x6F) return 'Tan/sand';
  if (rr===0xFF&&gg===0xEE&&bb===0xBB) return 'Sandy verge';
  if (rr===0&&gg===0x99&&bb===0x99) return 'Cyan/water';
  if (rr===0x02&&gg===0x54&&bb===0x73) return 'Deep water/ocean';
  if (rr===0x02&&gg===0x62&&bb===0x43) return 'Dark vegetation';
  if (rr===0x32&&gg===0x29&&bb===0x0E) return 'Road kerb/marking';
  if (rr===0&&gg===0x17&&bb===0x20) return 'Dark tarmac edge';
  if (rr===0xAD&&gg===0x2D&&bb===0x01) return 'Brown/rust element';
  if (rr===0x4A&&gg===0x82&&bb===0) return 'Olive green grass';
  if (rr===0&&gg===0x46&&bb===0) return 'Dark grass';
  if (rr===0&&gg===0x7B&&bb===0) return 'Mid green grass';
  if (rr===0x00&&gg===0x24&&bb===0) return 'Very dark grass';
  if (rr===rr&&gg===rr&&bb===rr) return 'Grey (neutral)';
  if (gg > rr+40 && gg > bb+40) return 'Vegetation';
  if (bb > rr+40 && bb > gg+40) return 'Water/sky';
  if (rr > gg+40 && rr > bb+40) return 'Red element';
  if (rr>150&&gg>100&&bb<80) return 'Brown terrain';
  return 'Unknown surface';
}

// ═══════════════════════════════════════════════════
//  RENDERER  (2D canvas, orthographic top-down + drag)
// ═══════════════════════════════════════════════════
const canvas = document.getElementById('viewport');
const ctx = canvas.getContext('2d');
const axCanvas = document.getElementById('axesCanvas');
const axCtx = axCanvas.getContext('2d');

let state = {
  parsed: null,
  mode: 'wire',      // wire | flat | both
  filter: 'all',     // all | selected
  selPrim: -1,
  selColor: null,
  camX: 0, camY: 0,
  zoom: 1,
  dragging: false,
  dragStartX: 0, dragStartY: 0,
  dragCamX: 0, dragCamY: 0,
  bounds: null,
};

function resizeCanvas() {
  const area = canvas.parentElement;
  const rect = area.getBoundingClientRect();
  canvas.width  = rect.width;
  canvas.height = rect.height - 40; // minus toolbar
  render();
}

// Compute bounding box from vertex indices (as abstract screen coords)
// We use the v0..v3 index values as X, face index as Y to create a layout
function computeLayout(prims) {
  if (!prims.length) return null;
  // Create a simple 2D layout: scatter prims by their vertex index range
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  const mapped = prims.map((p, fi) => {
    // Use vertex indices to create a rough spatial layout
    // v0 encodes position in original mesh
    const col = (p.v0 & 0xFF);
    const row = (p.v0 >> 8);
    const x = col * 12;
    const y = row * 12;
    minX=Math.min(minX,x); maxX=Math.max(maxX,x+10);
    minY=Math.min(minY,y); maxY=Math.max(maxY,y+10);
    return { ...p, lx:x, ly:y, lw:10, lh:10 };
  });
  return { prims: mapped, minX, maxX, minY, maxY,
    w: maxX-minX, h: maxY-minY };
}

function worldToScreen(wx, wy) {
  const cx = canvas.width/2  + state.camX;
  const cy = canvas.height/2 + state.camY;
  return {
    x: cx + wx * state.zoom,
    y: cy + wy * state.zoom
  };
}

function screenToWorld(sx, sy) {
  const cx = canvas.width/2  + state.camX;
  const cy = canvas.height/2 + state.camY;
  return {
    x: (sx - cx) / state.zoom,
    y: (sy - cy) / state.zoom
  };
}

function render() {
  if (!canvas.width) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#0a0c0f';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Grid
  drawGrid();

  if (!state.parsed) return;
  const layout = state.bounds;
  if (!layout) return;

  const prims = layout.prims;
  const showAll = state.filter === 'all';

  // Draw primitives
  prims.forEach((p) => {
    if (!showAll && p.i !== state.selPrim) return;
    if (state.selColor && p.hex !== state.selColor) return;

    const { x, y } = worldToScreen(p.lx - layout.minX - layout.w/2,
                                    p.ly - layout.minY - layout.h/2);
    const w = p.lw * state.zoom;
    const h = p.lh * state.zoom;
    const isSel = p.i === state.selPrim;

    if (state.mode === 'flat' || state.mode === 'both') {
      ctx.fillStyle = isSel ? '#ffffff' : p.hex;
      ctx.globalAlpha = isSel ? 1 : 0.85;
      ctx.fillRect(x, y, w, h);
      ctx.globalAlpha = 1;
    }

    if (state.mode === 'wire' || state.mode === 'both') {
      ctx.strokeStyle = isSel ? '#00e5ff'
                       : (state.mode === 'both' ? 'rgba(0,229,255,0.2)' : p.hex);
      ctx.lineWidth = isSel ? 1.5 : 0.5;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    }
  });

  // Selected highlight ring
  if (state.selPrim >= 0) {
    const p = prims.find(pp => pp.i === state.selPrim);
    if (p) {
      const {x,y} = worldToScreen(p.lx - layout.minX - layout.w/2,
                                   p.ly - layout.minY - layout.h/2);
      const w = p.lw * state.zoom;
      const h = p.lh * state.zoom;
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 8;
      ctx.strokeRect(x-2, y-2, w+4, h+4);
      ctx.shadowBlur = 0;
    }
  }

  drawAxes();
  updateStatusBar();
}

function drawGrid() {
  const step = 40 * state.zoom;
  if (step < 6) return;
  ctx.strokeStyle = 'rgba(42,47,56,0.6)';
  ctx.lineWidth = 0.5;
  const ox = (canvas.width/2 + state.camX) % step;
  const oy = (canvas.height/2 + state.camY) % step;
  for (let x = ox; x < canvas.width; x += step) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for (let y = oy; y < canvas.height; y += step) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }
  // origin cross
  const cx = canvas.width/2 + state.camX;
  const cy = canvas.height/2 + state.camY;
  ctx.strokeStyle = 'rgba(0,229,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,canvas.height); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(canvas.width,cy); ctx.stroke();
}

function drawAxes() {
  const ac = axCanvas;
  axCtx.clearRect(0,0,ac.width,ac.height);
  const cx=35, cy=35, len=24;
  axCtx.font = '9px Share Tech Mono, monospace';
  // X axis - red
  axCtx.strokeStyle='#ff3355'; axCtx.lineWidth=1.5;
  axCtx.beginPath(); axCtx.moveTo(cx,cy); axCtx.lineTo(cx+len,cy); axCtx.stroke();
  axCtx.fillStyle='#ff3355'; axCtx.fillText('X',cx+len+2,cy+4);
  // Y axis - green
  axCtx.strokeStyle='#00ff88'; axCtx.lineWidth=1.5;
  axCtx.beginPath(); axCtx.moveTo(cx,cy); axCtx.lineTo(cx,cy-len); axCtx.stroke();
  axCtx.fillStyle='#00ff88'; axCtx.fillText('Y',cx-4,cy-len-2);
}

// ═══════════════════════════════════════════════════
//  MOUSE / WHEEL INTERACTIONS
// ═══════════════════════════════════════════════════
canvas.addEventListener('mousedown', e => {
  state.dragging = true;
  state.dragStartX = e.clientX;
  state.dragStartY = e.clientY;
  state.dragCamX = state.camX;
  state.dragCamY = state.camY;
});
canvas.addEventListener('mousemove', e => {
  if (state.dragging) {
    state.camX = state.dragCamX + (e.clientX - state.dragStartX);
    state.camY = state.dragCamY + (e.clientY - state.dragStartY);
    render();
  }
  // update status
  const w = screenToWorld(e.offsetX, e.offsetY);
  document.getElementById('stMouse').innerHTML =
    `MOUSE <b>${Math.round(w.x)}, ${Math.round(w.y)}</b>`;
});
canvas.addEventListener('mouseup', e => {
  if (!state.dragging) return;
  state.dragging = false;
  // click detection (didn't move much)
  const dx = Math.abs(e.clientX - state.dragStartX);
  const dy = Math.abs(e.clientY - state.dragStartY);
  if (dx < 4 && dy < 4) handleClick(e.offsetX, e.offsetY);
});
canvas.addEventListener('mouseleave', () => { state.dragging = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  // Zoom towards cursor
  const wx = (e.offsetX - canvas.width/2 - state.camX) / state.zoom;
  const wy = (e.offsetY - canvas.height/2 - state.camY) / state.zoom;
  state.zoom = Math.max(0.05, Math.min(30, state.zoom * factor));
  state.camX = e.offsetX - canvas.width/2 - wx * state.zoom;
  state.camY = e.offsetY - canvas.height/2 - wy * state.zoom;
  document.getElementById('zoomSlider').value = Math.min(5, state.zoom);
  render();
}, { passive: false });

// Touch support
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    state.dragging = true;
    state.dragStartX = e.touches[0].clientX;
    state.dragStartY = e.touches[0].clientY;
    state.dragCamX = state.camX;
    state.dragCamY = state.camY;
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && state.dragging) {
    state.camX = state.dragCamX + (e.touches[0].clientX - state.dragStartX);
    state.camY = state.dragCamY + (e.touches[0].clientY - state.dragStartY);
    render();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    state.zoom = Math.max(0.05, Math.min(30, state.zoom * dist / lastTouchDist));
    lastTouchDist = dist;
    render();
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { state.dragging = false; });

function handleClick(sx, sy) {
  if (!state.bounds) return;
  const layout = state.bounds;
  const w = screenToWorld(sx, sy);
  let hit = -1;
  // iterate in reverse so topmost prim wins
  for (let i = layout.prims.length-1; i >= 0; i--) {
    const p = layout.prims[i];
    const lx = p.lx - layout.minX - layout.w/2;
    const ly = p.ly - layout.minY - layout.h/2;
    if (w.x >= lx && w.x <= lx+p.lw &&
        w.y >= ly && w.y <= ly+p.lh) {
      hit = p.i;
      break;
    }
  }
  selectPrim(hit);
}

// ═══════════════════════════════════════════════════
//  SELECTION
// ═══════════════════════════════════════════════════
function selectPrim(idx) {
  state.selPrim = idx;
  // Update sidebar list
  document.querySelectorAll('.prim-row').forEach(el => {
    el.classList.toggle('selected', parseInt(el.dataset.idx) === idx);
    if (parseInt(el.dataset.idx) === idx) el.scrollIntoView({ block: 'nearest' });
  });
  updateInfoPanel();
  render();
  document.getElementById('stSel').innerHTML = idx >= 0 ? `SEL <b>#${idx}</b>` : `SEL <b>NONE</b>`;
}

function selectByColor(hex) {
  state.selColor = (state.selColor === hex) ? null : hex;
  document.querySelectorAll('.pal-swatch').forEach(el => {
    el.classList.toggle('selected', el.dataset.hex === state.selColor);
  });
  render();
}

function updateInfoPanel() {
  const idx = state.selPrim;
  if (!state.parsed || idx < 0) {
    document.getElementById('selInfo').innerHTML = `
      <div class="info-row"><span class="info-key">Primitive</span><span class="info-val">—</span></div>`;
    return;
  }
  const p = state.parsed.prims.find(x => x.i === idx);
  if (!p) return;
  const isQuad = !!p.v3;
  const surf = guessSurface(p.r, p.g, p.b);

  document.getElementById('selInfo').innerHTML = `
    <div class="info-row"><span class="info-key">Index</span><span class="info-val accent">#${p.i}</span></div>
    <div class="info-row"><span class="info-key">Type</span><span class="info-val warn">${isQuad?'QUAD (POLY_F4)':'TRI (POLY_F3)'}</span></div>
    <div class="info-row"><span class="info-key">Flag</span><span class="info-val">0x${h2(p.flag)}</span></div>
    <div class="info-row"><span class="info-key">Face idx</span><span class="info-val">${p.idx}</span></div>
    <div class="info-row"><span class="info-key">Surface</span><span class="info-val" style="font-size:10px;text-align:right">${surf}</span></div>`;

  // colour preview
  const pc = document.getElementById('colPreview');
  const pctx = pc.getContext('2d');
  pctx.fillStyle = p.hex;
  pctx.fillRect(0,0,pc.width,pc.height);
  // checkerboard pattern to show alpha
  pctx.fillStyle = 'rgba(255,255,255,0.1)';
  for(let cy=0;cy<pc.height;cy+=8) for(let cx=(cy/8%2)*8;cx<pc.width;cx+=16)
    pctx.fillRect(cx,cy,8,8);

  document.getElementById('colInfo').innerHTML = `
    <div class="info-row"><span class="info-key">Hex</span><span class="info-val accent">${p.hex}</span></div>
    <div class="info-row"><span class="info-key">R / G / B</span><span class="info-val">${p.r} / ${p.g} / ${p.b}</span></div>
    <div class="info-row"><span class="info-key">Alpha</span><span class="info-val">${p.a} (0x${h2(p.a)})</span></div>
    <div class="info-row"><span class="info-key">Semi-trans</span><span class="info-val">${p.a===0x28?'YES':'NO'}</span></div>`;

  document.getElementById('vertInfo').innerHTML = `
    <div class="info-row"><span class="info-key">V0</span><span class="info-val">0x${p.v0.toString(16).toUpperCase().padStart(4,'0')} (${p.v0})</span></div>
    <div class="info-row"><span class="info-key">V1</span><span class="info-val">0x${p.v1.toString(16).toUpperCase().padStart(4,'0')} (${p.v1})</span></div>
    <div class="info-row"><span class="info-key">V2</span><span class="info-val">0x${p.v2.toString(16).toUpperCase().padStart(4,'0')} (${p.v2})</span></div>
    <div class="info-row"><span class="info-key">V3</span><span class="info-val">${isQuad?`0x${p.v3.toString(16).toUpperCase().padStart(4,'0')} (${p.v3})`:'—'}</span></div>`;
}

function updateCamInfo() {
  document.getElementById('camInfo').innerHTML = `
    <div class="info-row"><span class="info-key">Offset X</span><span class="info-val">${Math.round(state.camX)}</span></div>
    <div class="info-row"><span class="info-key">Offset Y</span><span class="info-val">${Math.round(state.camY)}</span></div>
    <div class="info-row"><span class="info-key">Zoom</span><span class="info-val accent">${state.zoom.toFixed(3)}x</span></div>`;
  document.getElementById('stCam').innerHTML =
    `CAM <b>${Math.round(state.camX)},${Math.round(state.camY)} z=${state.zoom.toFixed(2)}</b>`;
}

function updateStatusBar() {
  updateCamInfo();
}

// ═══════════════════════════════════════════════════
//  UI ACTIONS
// ═══════════════════════════════════════════════════
function toggleMode(m, btn) {
  state.mode = m;
  document.querySelectorAll('#btnWire,#btnFlat,#btnBoth').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setFilter(f, btn) {
  state.filter = f;
  document.querySelectorAll('#btnAll,#btnSel').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setZoomSlider(v) {
  state.zoom = parseFloat(v);
  render();
}

function resetCamera() {
  state.camX = 0; state.camY = 0; state.zoom = 1;
  document.getElementById('zoomSlider').value = 1;
  render();
}

function frameAll() {
  if (!state.bounds) return;
  const b = state.bounds;
  const pad = 40;
  const scaleX = (canvas.width  - pad*2) / b.w;
  const scaleY = (canvas.height - pad*2) / b.h;
  state.zoom = Math.min(scaleX, scaleY, 10);
  state.camX = 0; state.camY = 0;
  document.getElementById('zoomSlider').value = Math.min(5, state.zoom);
  render();
}

function switchSTab(idx, el) {
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.sidebar-panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`spanel-${idx}`).classList.add('active');
}

function filterPrims(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.prim-row').forEach(el => {
    el.style.display = (!q || el.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
}

// ═══════════════════════════════════════════════════
//  POPULATE UI
// ═══════════════════════════════════════════════════
function populateUI(parsed, fileName) {
  // Header stats
  document.getElementById('hPrims').textContent = parsed.prims.length.toLocaleString();
  document.getElementById('hVerts').textContent = parsed.uVerts.size.toLocaleString();
  document.getElementById('hCols').textContent  = Object.keys(parsed.colorMap).length;
  document.getElementById('fileLabel').textContent = fileName;
  document.getElementById('fileLabel').classList.add('loaded');
  document.getElementById('stStatus').innerHTML = `STATUS <b class="" style="color:var(--green)">LOADED</b>`;

  // Header table
  const hdr = parsed.header;
  const hrows = [
    ['File ID',    `0x${hdr.id.toString(16).toUpperCase()}`],
    ['Data offset',`0x${hdr.dataOff.toString(16).toUpperCase()}`],
    ['Face count', hdr.faceCount.toLocaleString()],
    ['Face count B', hdr.faceCount2.toLocaleString()],
    ['Vert count', hdr.totalVerts.toLocaleString()],
    ['File size',  `${(parsed.fileSize/1024).toFixed(1)} KB`],
    ['Record size','20 bytes'],
    ['Format',     'PS1 POLY_F4/F3'],
    ['Primitives', parsed.prims.length.toLocaleString()],
    ['Uniq colours', Object.keys(parsed.colorMap).length],
  ];
  document.getElementById('hdrTable').innerHTML =
    hrows.map(([k,v])=>`<div class="hdr-row"><span class="hdr-key">${k}</span><span class="hdr-val">${v}</span></div>`).join('');

  // Palette
  const sorted = Object.values(parsed.colorMap).sort((a,b)=>b.count-a.count);
  document.getElementById('paletteGrid').innerHTML = sorted.map(c=>`
    <div class="pal-item" onclick="selectByColor('${c.hex}')" title="${guessSurface(c.r,c.g,c.b)} — ${c.count} faces">
      <div class="pal-swatch" data-hex="${c.hex}" style="background:${c.hex}"></div>
      <span class="pal-count">${c.count}</span>
    </div>`).join('');

  // Prim list
  const rows = parsed.prims.slice(0, 2000).map(p => {
    const isQ = !!p.v3;
    return `<div class="prim-row" data-idx="${p.i}" onclick="selectPrim(${p.i})">
      <div class="prim-dot" style="background:${p.hex}"></div>
      <span class="prim-idx">#${p.i}</span>
      <span class="prim-verts">${p.v0.toString(16).toUpperCase()}&nbsp;${p.v1.toString(16).toUpperCase()}&nbsp;${p.v2.toString(16).toUpperCase()}${isQ?'&nbsp;'+p.v3.toString(16).toUpperCase():''}</span>
      <span class="prim-type">${isQ?'Q4':'T3'}</span>
    </div>`;
  }).join('');
  document.getElementById('primList').innerHTML = rows +
    (parsed.prims.length > 2000 ? `<div style="padding:8px 10px;font-size:10px;color:var(--text2);font-family:Share Tech Mono,monospace">... ${(parsed.prims.length-2000).toLocaleString()} more</div>` : '');
}

// ═══════════════════════════════════════════════════
//  FILE LOADING
// ═══════════════════════════════════════════════════
function loadFile(file) {
  if (!file) return;
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('stStatus').innerHTML = `STATUS <b>LOADING...</b>`;

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = parseDAT(e.target.result);
      state.parsed = parsed;
      state.bounds = computeLayout(parsed.prims);
      state.selPrim = -1;
      state.selColor = null;

      populateUI(parsed, file.name);
      document.getElementById('dropOverlay').classList.add('hidden');
      document.getElementById('spinner').style.display = 'none';

      frameAll();
      render();
    } catch(err) {
      document.getElementById('stStatus').innerHTML = `STATUS <b style="color:var(--red)">ERROR: ${err.message}</b>`;
      document.getElementById('spinner').style.display = 'none';
    }
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById('fileInput').addEventListener('change', e => {
  loadFile(e.target.files[0]);
});

// Drag & drop
const dropBox = document.getElementById('dropBox');
const dropOverlay = document.getElementById('dropOverlay');
['dragenter','dragover'].forEach(ev => {
  dropOverlay.addEventListener(ev, e => {
    e.preventDefault();
    dropBox.classList.add('drag-over');
  });
});
['dragleave','drop'].forEach(ev => {
  dropOverlay.addEventListener(ev, e => {
    e.preventDefault();
    dropBox.classList.remove('drag-over');
  });
});
dropOverlay.addEventListener('drop', e => {
  loadFile(e.dataTransfer.files[0]);
});

// Also accept drops on the canvas when a file is already loaded
canvas.addEventListener('dragover', e => e.preventDefault());
canvas.addEventListener('drop', e => {
  e.preventDefault();
  loadFile(e.dataTransfer.files[0]);
});

// ═══════════════════════════════════════════════════
//  RESIZE OBSERVER
// ═══════════════════════════════════════════════════
const ro = new ResizeObserver(() => resizeCanvas());
ro.observe(canvas.parentElement);

// Init
resizeCanvas();
render();
</script>
</body>
